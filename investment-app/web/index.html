<script>
"use strict";
// ======================================================= catálogo
const CATALOG = {
  "Acciones": { "AAPL": "Apple", "MSFT": "Microsoft", "NVDA": "NVIDIA", "GOOGL": "Alphabet (Google)", "AMZN": "Amazon", "META": "Meta Platforms", "TSLA": "Tesla", "JPM": "JPMorgan Chase", "KO": "Coca-Cola", "JNJ": "Johnson & Johnson", "SAN.MC": "Banco Santander", "ITX.MC": "Inditex", "MELI": "MercadoLibre", "YPF": "YPF" },
  "ETF": { "SPY": "S&P 500 (SPDR)", "QQQ": "Nasdaq 100 (Invesco)", "VT": "Mercado mundial (Vanguard)", "VWO": "Emergentes (Vanguard)", "AGG": "Bonos EE. UU. (iShares)", "GLD": "Oro físico (SPDR)", "VNQ": "Inmobiliario EE. UU." },
  "Materias primas": { "GC=F": "Oro", "SI=F": "Plata", "HG=F": "Cobre", "PL=F": "Platino", "CL=F": "Petróleo WTI", "BZ=F": "Petróleo Brent", "NG=F": "Gas natural", "ZC=F": "Maíz", "ZW=F": "Trigo", "ZS=F": "Soja", "KC=F": "Café", "SB=F": "Azúcar" },
  "Criptomonedas": { "BTC-USD": "Bitcoin", "ETH-USD": "Ethereum", "SOL-USD": "Solana" },
  "Índices": { "^GSPC": "S&P 500", "^IXIC": "Nasdaq Composite", "^DJI": "Dow Jones", "^IBEX": "IBEX 35", "^MERV": "Merval", "^STOXX50E": "Euro Stoxx 50" },
  "Divisas": { "EURUSD=X": "Euro / Dólar", "USDMXN=X": "Dólar / Peso mexicano", "USDARS=X": "Dólar / Peso argentino" },
};
const NAMES = Object.assign({}, ...Object.values(CATALOG));
const CLASSES = Object.keys(CATALOG);
function assetClass(t) {
  for (const c of CLASSES) if (t in CATALOG[c]) return c;
  if (t.endsWith("=F")) return "Materias primas";
  if (t.endsWith("-USD")) return "Criptomonedas";
  if (t.startsWith("^")) return "Índices";
  if (t.endsWith("=X")) return "Divisas";
  return "Acciones";
}
const nameOf = t => NAMES[t] || t;

// ======================================================= precios simulados
// Paseo aleatorio geométrico con un factor de mercado común; reproducible por símbolo.
const PARAMS = { "Acciones": [0.10, 0.30, 150], "ETF": [0.08, 0.17, 300], "Materias primas": [0.04, 0.28, 80], "Criptomonedas": [0.25, 0.70, 20000], "Índices": [0.08, 0.18, 5000], "Divisas": [0.0, 0.08, 1.1] };
function hash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function normals(r, n) { const out = new Float64Array(n); for (let i = 0; i < n; i++) { const u = Math.max(r(), 1e-12), v = r(); out[i] = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); } return out; }
const DATES = (() => { const out = []; const d = new Date(); d.setHours(0, 0, 0, 0); while (out.length < 1260) { const w = d.getDay(); if (w !== 0 && w !== 6) out.push(new Date(d)); d.setDate(d.getDate() - 1); } return out.reverse(); })();
const MARKET = normals(rng(12345), DATES.length);
const cache = new Map();
function fullSeries(t) {
  if (cache.has(t)) return cache.get(t);
  const cls = assetClass(t); const [mu, sigma, p0] = PARAMS[cls];
  const r = rng(hash(t)); const own = normals(r, DATES.length);
  const beta = ["Acciones", "ETF", "Índices"].includes(cls) ? 0.6 : 0.2;
  const dt = 1 / 252; let p = p0 * (0.3 + 1.4 * r()); const out = new Array(DATES.length);
  for (let i = 0; i < DATES.length; i++) {
    const z = beta * MARKET[i] + Math.sqrt(1 - beta * beta) * own[i];
    p *= Math.exp((mu - 0.5 * sigma * sigma) * dt + sigma * Math.sqrt(dt) * z); out[i] = p;
  }
  cache.set(t, out); return out;
}
const PERIODS = { "3m": ["3 meses", 63], "6m": ["6 meses", 126], "1y": ["1 año", 252], "2y": ["2 años", 504], "5y": ["5 años", 1260] };
function series(t, period) { const n = PERIODS[period][1]; return { dates: DATES.slice(-n), close: fullSeries(t).slice(-n) }; }

// ======================================================= indicadores y métricas
function sma(a, w) { const o = new Array(a.length).fill(null); let s = 0; for (let i = 0; i < a.length; i++) { s += a[i]; if (i >= w) s -= a[i - w]; if (i >= w - 1) o[i] = s / w; } return o; }
function ema(a, span) { const k = 2 / (span + 1); const o = new Array(a.length); o[0] = a[0]; for (let i = 1; i < a.length; i++) o[i] = k * a[i] + (1 - k) * o[i - 1]; return o; }
function rsi(a, p = 14) {
  const o = new Array(a.length).fill(null); if (a.length <= p) return o; const al = 1 / p; let g = 0, l = 0;
  for (let i = 1; i < a.length; i++) {
    const d = a[i] - a[i - 1], gi = Math.max(d, 0), li = Math.max(-d, 0);
    if (i === 1) { g = gi; l = li; } else { g = (1 - al) * g + al * gi; l = (1 - al) * l + al * li; }
    if (i >= p) o[i] = g === 0 && l === 0 ? 50 : l === 0 ? 100 : 100 - 100 / (1 + g / l);
  }
  return o;
}
function macd(a) { const f = ema(a, 12), s = ema(a, 26); const line = a.map((_, i) => f[i] - s[i]); const sig = ema(line, 9); return { line, sig, hist: line.map((v, i) => v - sig[i]) }; }
function bollinger(a, w = 20, k = 2) { const m = sma(a, w); const up = [], lo = []; for (let i = 0; i < a.length; i++) { if (m[i] === null) { up.push(null); lo.push(null); continue; } let s = 0; for (let j = i - w + 1; j <= i; j++) s += (a[j] - m[i]) ** 2; const sd = Math.sqrt(s / (w - 1)); up.push(m[i] + k * sd); lo.push(m[i] - k * sd); } return { up, lo }; }
function returns(a) { const r = []; for (let i = 1; i < a.length; i++) r.push(a[i] / a[i - 1] - 1); return r; }
function mean(a) { return a.reduce((x, y) => x + y, 0) / a.length; }
function std(a) { const m = mean(a); return Math.sqrt(a.reduce((x, y) => x + (y - m) ** 2, 0) / (a.length - 1)); }
function drawdown(a) { let mx = -Infinity; return a.map(v => { mx = Math.max(mx, v); return v / mx - 1; }); }
function summary(s, rf = 0) {
  const c = s.close, r = returns(c), sd = std(r);
  const years = (s.dates.at(-1) - s.dates[0]) / (365.25 * 864e5);
  return { total: c.at(-1) / c[0] - 1, cagr: Math.pow(c.at(-1) / c[0], 1 / years) - 1, vol: sd * Math.sqrt(252), sharpe: sd ? (mean(r) - rf / 252) / sd * Math.sqrt(252) : NaN, mdd: Math.min(...drawdown(c)) };
}
function corr(a, b) { const ma = mean(a), mb = mean(b); let n = 0, da = 0, db = 0; for (let i = 0; i < a.length; i++) { n += (a[i] - ma) * (b[i] - mb); da += (a[i] - ma) ** 2; db += (b[i] - mb) ** 2; } return n / Math.sqrt(da * db); }
function outlook(c) {
  const reasons = []; let pts = 0, w = 0; const p = c.at(-1);
  const s50 = c.length >= 50 ? sma(c, 50).at(-1) : null, s200 = c.length >= 200 ? sma(c, 200).at(-1) : null;
  if (s50 !== null) { w++; if (p > s50) { pts++; reasons.push(`El precio está por encima de su media de 50 sesiones (${num(s50)}): tendencia de corto plazo al alza.`); } else { pts--; reasons.push(`El precio está por debajo de su media de 50 sesiones (${num(s50)}): tendencia de corto plazo a la baja.`); } }
  if (s200 !== null) {
    w++; if (p > s200) { pts++; reasons.push(`Por encima de la media de 200 sesiones (${num(s200)}): tendencia de largo plazo alcista.`); } else { pts--; reasons.push(`Por debajo de la media de 200 sesiones (${num(s200)}): tendencia de largo plazo bajista.`); }
    if (s50 !== null) { w += 0.5; if (s50 > s200) { pts += 0.5; reasons.push("La media de 50 está sobre la de 200 (configuración de cruce dorado)."); } else { pts -= 0.5; reasons.push("La media de 50 está bajo la de 200 (configuración de cruce de la muerte)."); } }
  }
  if (c.length >= 35) { w++; if (macd(c).hist.at(-1) > 0) { pts++; reasons.push("MACD por encima de su señal: el impulso es positivo."); } else { pts--; reasons.push("MACD por debajo de su señal: el impulso es negativo."); } }
  const r = rsi(c).at(-1);
  if (r !== null) { w++; if (r >= 70) { pts--; reasons.push(`RSI en ${r.toFixed(0)}: zona de sobrecompra, posible corrección.`); } else if (r <= 30) { pts++; reasons.push(`RSI en ${r.toFixed(0)}: zona de sobreventa, posible rebote.`); } else reasons.push(`RSI en ${r.toFixed(0)}: zona neutral.`); }
  if (!w) return { score: 0, verdict: "Datos insuficientes", reasons: ["Se necesitan más sesiones de historial."] };

  const verdict = score >= 50 ? "Alcista" : score >= 15 ? "Moderadamente alcista" : score > -15 ? "Neutral" : score > -50 ? "Moderadamente bajista" : "Bajista";

function dca(s, monthly) {

const nf2 = new Intl.NumberFormat("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function fix2(x) { return isFinite(x) ? (Math.abs(x) < 0.005 ? 0 : x).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—"; }
function cls(x) { return x > 0 ? "up" : x < 0 ? "down" : ""; }
const fmtDate = d => d.toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" });

function scoreBar(score) {

  return `<span class="score"><span class="track"><b></b><i style="left:${left}%;width:${width}%;background:${verdictColor(score)}"></i></span><span class="n" style="font-family:var(--f-mono);font-size:12px;min-width:30px">${score > 0 ? "+" : ""}${score}</span></span>`;
}

// ======================================================= gráfico de líneas SVG con tooltip
// series: [{name, data, color, width?, dash?, kind?: 'line'|'area'|'bars'}]
function lineChart(el, dates, ser, opt = {}) {
  const W = Math.max(el.clientWidth || 1000, 280), H = opt.height || 320, L = W < 500 ? 52 : 64, R = 12, T = 10, B = opt.hideX ? 8 : 26;
  const vals = ser.flatMap(s => s.data).filter(v => v != null && isFinite(v));
  let lo = opt.min ?? Math.min(...vals), hi = opt.max ?? Math.max(...vals);
  if (opt.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (hi === lo) { hi += 1; lo -= 1; }
  const pad = opt.min != null ? 0 : (hi - lo) * 0.05; lo -= opt.min != null ? 0 : pad; hi += opt.max != null ? 0 : pad;
  const n = dates.length, x = i => L + (W - L - R) * (n === 1 ? 0 : i / (n - 1)), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const ticks = niceTicks(lo, hi, opt.ticks || 5);
  const fmtY = opt.fmtY || (v => num(v));
  let g = "";
  for (const t of ticks) g += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${esc(fmtY(t))}</text>`;
  for (const h of opt.hlines || []) g += `<line x1="${L}" x2="${W - R}" y1="${y(h)}" y2="${y(h)}" stroke="var(--ink-3)" stroke-dasharray="4 4" stroke-width="1"/>`;
  if (!opt.hideX) { const k = Math.min(6, n); for (let j = 0; j < k; j++) { const i = Math.round(j * (n - 1) / Math.max(k - 1, 1)); g += `<text x="${x(i)}" y="${H - 6}" text-anchor="${j === 0 ? "start" : j === k - 1 ? "end" : "middle"}">${dates[i].toLocaleDateString("es-ES", { month: "short", year: "2-digit" })}</text>`; } }
  for (const s of ser) {
    if (s.kind === "bars") {
      const bw = Math.max((W - L - R) / n - 0.5, 0.6);
      s.data.forEach((v, i) => { if (v == null) return; const y0 = y(0), y1 = y(v); g += `<rect x="${x(i) - bw / 2}" y="${Math.min(y0, y1)}" width="${bw}" height="${Math.max(Math.abs(y1 - y0), 0.5)}" fill="${v >= 0 ? "var(--up)" : "var(--down)"}" opacity="0.75"/>`; });
      continue;
    }
    let d = "", on = false;
    s.data.forEach((v, i) => { if (v == null || !isFinite(v)) { on = false; return; } d += (on ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); on = true; });
    if (s.kind === "area") { const first = s.data.findIndex(v => v != null); g += `<path d="${d}L${x(n - 1)} ${y(Math.max(lo, Math.min(0, hi)))}L${x(first)} ${y(Math.max(lo, Math.min(0, hi)))}Z" fill="${s.color}" opacity="0.18"/>`; }
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" ${s.dash ? 'stroke-dasharray="6 4"' : ""} stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  }
  const legend = opt.legend === false ? "" : `<div class="legend">${ser.filter(s => s.kind !== "bars" || s.name).map(s => `<span><i class="${s.dash ? "dash" : ""}" style="background:${s.kind === "bars" ? "var(--up)" : s.color};color:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
  el.innerHTML = `${legend}<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || "Gráfico")}">${g}<line class="cross" y1="${T}" y2="${H - B}" stroke="var(--ink-3)" stroke-width="1" visibility="hidden"/><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" class="hit"/></svg><div class="tip" hidden></div></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cross = el.querySelector(".cross"), box = el.querySelector(".chart");
  const fmtT = opt.fmtTip || fmtY;
  function move(ev) {
    const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - L) / (W - L - R) * (n - 1))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    tip.innerHTML = `<div class="t">${fmtDate(dates[i])}</div>` + ser.map(s => s.data[i] == null ? "" : `<div class="r"><i style="background:${s.kind === "bars" ? (s.data[i] >= 0 ? "var(--up)" : "var(--down)") : s.color}"></i>${esc(s.name)}: ${esc(fmtT(s.data[i]))}</div>`).join("");
    tip.hidden = false; const bx = box.getBoundingClientRect(); const left = ev.clientX - bx.left;
    tip.style.top = "8px"; tip.style.left = (left > bx.width / 2 ? left - tip.offsetWidth - 14 : left + 14) + "px";
  }
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerleave", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); });
}
function niceTicks(lo, hi, count) {
  const span = hi - lo, step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0))), err = step0 / mag;
  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag; const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10)); return out;
}
function hbars(items, fmt = v => pct(v, true), simple = false) {
  const mx = Math.max(...items.map(i => Math.abs(i.v)), 1e-9);
  return `<div class="hbars">${items.map(i => {
    if (simple) return `<div class="hbar simple"><span class="name" title="${esc(i.name)}">${esc(i.name)}</span><span class="bar"><i style="left:0;width:${100 * i.v / mx}%;background:${i.color || "var(--accent)"}"></i></span><span class="val">${fmt(i.v)}</span></div>`;
    const w = 50 * Math.abs(i.v) / mx, left = i.v >= 0 ? 50 : 50 - w;
    return `<div class="hbar"><span class="name" title="${esc(i.name)}">${esc(i.name)}</span><span class="bar"><b></b><i style="left:${left}%;width:${w}%;background:${i.v >= 0 ? "var(--up)" : "var(--down)"}"></i></span><span class="val">${fmt(i.v)}</span></div>`;
  }).join("")}</div>`;
}
function periodSelect(id, value) { return `<div class="field"><label for="${id}">Periodo</label><select id="${id}">${Object.entries(PERIODS).map(([k, [l]]) => `<option value="${k}" ${k === value ? "selected" : ""}>${l}</option>`).join("")}</select></div>`; }
function assetSelect(id, value) { return `<div class="field" style="flex:1;min-width:220px"><label for="${id}">Activo</label><select id="${id}">${CLASSES.map(c => `<optgroup label="${c}">${Object.entries(CATALOG[c]).map(([t, n]) => `<option value="${esc(t)}" ${t === value ? "selected" : ""}>${esc(n)} (${esc(t)})</option>`).join("")}</optgroup>`).join("")}</select></div>`; }

    <div class="chips">${list.map(t => `<button class="chip" aria-pressed="true" data-t="${esc(t)}" title="Quitar"><span class="dot" style="background:${color(t)}"></span>${esc(nameOf(t))} ✕</button>`).join("")}${list.length >= 8 ? `<span class="muted">Máximo 8 activos.</span>` : ""}</div>
    ${list.length < 2 ? `<div class="panel"><p class="muted">Elige al menos dos activos.</p></div>` : `
    <div class="panel"><h2>Evolución (base 100)</h2><p class="muted" style="margin-top:-6px">Todos empiezan en 100 para poder compararlos aunque tengan precios muy distintos.</p><div id="c-norm"></div></div>
    <div class="panel tbl-wrap"><h2>Rentabilidad y riesgo</h2><table><thead><tr><th>Activo</th><th class="n">Rentabilidad</th><th class="n">Anual</th><th class="n">Volatilidad</th><th class="n">Sharpe</th><th class="n">Máx. caída</th></tr></thead><tbody>
      ${data.map(({ t, s }) => { const m = summary(s); return `<tr><td><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color(t)};margin-right:6px"></span>${esc(nameOf(t))} <span class="sym">${esc(t)}</span></td><td class="n ${cls(m.total)}">${pct(m.total, true)}</td><td class="n ${cls(m.cagr)}">${pct(m.cagr, true)}</td><td class="n">${pct(m.vol)}</td><td class="n">${fix2(m.sharpe)}</td><td class="n down">${pct(m.mdd)}</td></tr>`; }).join("")}
    </tbody></table></div>
    <div class="panel"><h2>Correlación</h2><p class="muted" style="margin-top:-6px">+1: se mueven igual · 0: independientes · negativo: suelen moverse en sentido contrario.</p><div class="tbl-wrap"><div class="heat" id="c-heat" style="grid-template-columns:minmax(90px,150px) repeat(${list.length}, minmax(52px,1fr));min-width:${150 + 56 * list.length}px"></div></div></div>`}
  </div>`;
  app.querySelectorAll(".chip[data-t]").forEach(b => b.onclick = () => { st.list = st.list.filter(t => t !== b.dataset.t); render(); });
  bind("c-p", "change", v => st.period = v);
  document.getElementById("c-add").onchange = e => { if (e.target.value && st.list.length < 8) { st.list = [...list, e.target.value]; render(); } };
  if (list.length < 2) return;
  lineChart(document.getElementById("c-norm"), data[0].s.dates, data.map(({ t, s }) => ({ name: nameOf(t), data: s.close.map(v => 100 * v / s.close[0]), color: color(t) })), { height: 340, fmtY: v => v.toFixed(0), fmtTip: v => v.toFixed(1), label: "Evolución base 100" });
  const rets = data.map(d => returns(d.s.close)); const heat = document.getElementById("c-heat");
  let h = `<div class="h"></div>` + list.map(t => `<div class="h hc" title="${esc(nameOf(t))}">${esc(t)}</div>`).join("");
  list.forEach((t, i) => { h += `<div class="h" title="${esc(nameOf(t))}">${esc(nameOf(t))}</div>`; list.forEach((_, j) => { const v = i === j ? 1 : corr(rets[i], rets[j]); const k = Math.round(Math.abs(v) * 85); const bg = `color-mix(in oklab, var(${v >= 0 ? "--heat-pos" : "--heat-neg"}) ${k}%, var(--heat-mid))`; h += `<div style="background:${bg};color:${Math.abs(v) > 0.6 ? "#fff" : "var(--ink)"}" title="${esc(nameOf(t))} / ${esc(nameOf(list[j]))}: ${v.toFixed(2)}">${v.toFixed(2)}</div>`; }); });
  heat.innerHTML = h;
}

function pagePortfolio() {
  const ps = state.portfolio; const valid = cleanPositions(ps);
  const valued = valid.map(p => { const price = fullSeries(p.ticker).at(-1); const coste = p.cantidad * p.precio_medio, valor = p.cantidad * price; return { ...p, clase: assetClass(p.ticker), price, coste, valor, gan: valor - coste, ganp: coste ? (valor - coste) / coste : NaN }; });
  const total = valued.reduce((a, r) => a + r.valor, 0), cost = valued.reduce((a, r) => a + r.coste, 0);
  valued.forEach(r => r.peso = total ? r.valor / total : 0);
  const byClass = {}; valued.forEach(r => byClass[r.clase] = (byClass[r.clase] || 0) + r.valor);
  const classes = [...new Set([...Object.keys(byClass), "Acciones", "ETF", "Materias primas", "Criptomonedas"])].sort();
  if (!state.targets) { state.targets = {}; classes.forEach(c => state.targets[c] = Math.round(100 * (byClass[c] || 0) / (total || 1))); }
  classes.forEach(c => { if (!(c in state.targets)) state.targets[c] = 0; });
  const tsum = classes.reduce((a, c) => a + (+state.targets[c] || 0), 0);
  const top = valued.reduce((a, r) => r.peso > (a?.peso || 0) ? r : a, null);
  const hist = DATES.slice(-252), histVal = hist.map((_, i) => valued.reduce((a, r) => a + r.cantidad * fullSeries(r.ticker).at(-252 + i), 0));
  const known = Object.keys(NAMES);
  app.innerHTML = `
  <h1>Mi cartera</h1>
  <p class="lede">Anota lo que tienes: símbolo, cantidad y precio medio de compra. Verás tus ganancias, cómo está repartido tu dinero y qué ajustar para llegar al reparto que quieres.</p>
  <div class="stack">
    <div class="panel">
      <div class="verdict"><h2 style="margin:0">Posiciones</h2>${state.portfolioIsExample ? `<span class="tag">Ejemplo</span><span class="muted">Cambia las filas por las tuyas y pulsa Guardar.</span>` : ""}</div>
      <div class="tbl-wrap"><table class="edit"><thead><tr><th>Símbolo</th><th>Cantidad</th><th>Precio medio</th><th></th></tr></thead><tbody>
        ${ps.map((p, i) => `<tr><td><input type="text" id="p-t-${i}" list="tickers" value="${esc(p.ticker)}" data-i="${i}" data-f="ticker" aria-label="Símbolo"></td><td><input type="number" id="p-q-${i}" min="0" step="any" value="${esc(p.cantidad)}" data-i="${i}" data-f="cantidad" aria-label="Cantidad"></td><td><input type="number" id="p-p-${i}" min="0" step="any" value="${esc(p.precio_medio)}" data-i="${i}" data-f="precio_medio" aria-label="Precio medio"></td><td><button class="ghost" data-del="${i}" aria-label="Eliminar fila">✕</button></td></tr>`).join("")}
      </tbody></table></div>
      <datalist id="tickers">${known.map(t => `<option value="${esc(t)}">${esc(nameOf(t))}</option>`).join("")}</datalist>
      <div class="row-actions" style="margin-top:12px"><button id="p-add">+ Añadir fila</button><button class="primary" id="p-save">Guardar cartera</button><button id="p-ex">Cargar ejemplo</button><span class="muted" id="p-msg">${esc(state.saveMsg)}</span></div>
    </div>
    ${valued.length ? `
    <div class="kpis">
      <div class="kpi"><div class="lbl">Valor actual</div><div class="v">${money(total)}</div></div>
      <div class="kpi"><div class="lbl">Invertido</div><div class="v">${money(cost)}</div></div>
      <div class="kpi"><div class="lbl">Ganancia / pérdida</div><div class="v ${cls(total - cost)}">${money(total - cost)}</div><div class="d ${cls(total - cost)}">${pct((total - cost) / cost, true)}</div></div>
    </div>
    ${top && top.peso > 0.4 ? `<div class="alert">Concentración alta: <strong>${esc(nameOf(top.ticker))}</strong> pesa el ${pct(top.peso)} de tu cartera. Si cae, te afecta mucho.</div>` : ""}
    <div class="panel tbl-wrap"><table><thead><tr><th>Activo</th><th>Clase</th><th class="n">Precio actual</th><th class="n">Valor</th><th class="n">Ganancia</th><th class="n">%</th><th class="n">Peso</th></tr></thead><tbody>
      ${valued.map(r => `<tr><td>${esc(nameOf(r.ticker))} <span class="sym">${esc(r.ticker)}</span></td><td>${r.clase}</td><td class="n">${num(r.price)}</td><td class="n">${money(r.valor)}</td><td class="n ${cls(r.gan)}">${money(r.gan)}</td><td class="n ${cls(r.gan)}">${pct(r.ganp, true)}</td><td class="n">${pct(r.peso)}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="grid2">
      <div class="panel"><h2>Reparto por clase</h2>${hbars(Object.entries(byClass).sort((a, b) => b[1] - a[1]).map(([c, v]) => ({ name: c, v: v / total })), v => pct(v), true)}</div>
      <div class="panel"><h2>Valor en el último año</h2><p class="muted" style="margin-top:-6px">Con tus posiciones actuales.</p><div id="p-hist"></div></div>
    </div>
    <div class="panel"><h2>Rebalanceo</h2><p class="muted" style="margin-top:-6px">Indica qué porcentaje quieres en cada clase. Te decimos cuánto comprar (+) o vender (−).</p>
      <div class="controls" style="margin-bottom:14px">${classes.map(c => `<div class="field"><label for="tg-${hash(c)}">${c} (%)</label><input type="number" id="tg-${hash(c)}" data-c="${c}" min="0" max="100" step="5" value="${state.targets[c]}" style="width:110px"></div>`).join("")}</div>
      ${tsum !== 100 ? `<p class="alert">Los objetivos suman ${tsum} %. Deben sumar 100 %.</p>` : `<div class="tbl-wrap"><table><thead><tr><th>Clase</th><th class="n">Ahora</th><th class="n">Objetivo</th><th class="n">Comprar (+) / vender (−)</th></tr></thead><tbody>
        ${classes.filter(c => byClass[c] || state.targets[c]).map(c => { const cur = (byClass[c] || 0); const adj = state.targets[c] / 100 * total - cur; return `<tr><td>${c}</td><td class="n">${pct(cur / total)}</td><td class="n">${pct(state.targets[c] / 100)}</td><td class="n ${cls(adj)}">${adj > 0 ? "+" : ""}${money(adj)}</td></tr>`; }).join("")}
      </tbody></table></div>`}
    </div>` : `<div class="panel"><p class="muted">Tu cartera está vacía. Añade una fila o pulsa «Cargar ejemplo».</p></div>`}
  </div>`;
  app.querySelectorAll("input[data-f]").forEach(inp => inp.addEventListener("change", e => { const i = +e.target.dataset.i, f = e.target.dataset.f; ps[i][f] = f === "ticker" ? e.target.value.toUpperCase() : e.target.value; state.saveMsg = ""; render(); }));
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { ps.splice(+b.dataset.del, 1); render(); });
  app.querySelectorAll("input[data-c]").forEach(inp => inp.addEventListener("change", e => { state.targets[e.target.dataset.c] = Math.max(0, +e.target.value || 0); render(); }));
  document.getElementById("p-add").onclick = () => { ps.push({ ticker: "", cantidad: "", precio_medio: "" }); render(); document.getElementById(`p-t-${ps.length - 1}`)?.focus(); };
  document.getElementById("p-save").onclick = savePortfolio;
  document.getElementById("p-ex").onclick = () => { state.portfolio = examplePortfolio(); state.portfolioIsExample = true; state.targets = null; state.saveMsg = ""; render(); };
  if (valued.length) lineChart(document.getElementById("p-hist"), hist, [{ name: "Valor", data: histVal, color: css("--s1") }], { height: 220, legend: false, label: "Valor de la cartera" });
}

function pageSim() {
  const st = state.sim; const s = series(st.t, st.period); const d = dca(s, st.monthly);
  const units = d.invested / s.close[0]; const lump = s.close.map(p => units * p);
  const lumpFinal = lump.at(-1);
  app.innerHTML = `
  <h1>Simulador de aportaciones</h1>
  <p class="lede">¿Qué habría pasado si hubieras invertido en el pasado? Compara aportar una cantidad fija cada mes (DCA) con invertir el mismo dinero de golpe al principio.</p>
  <div class="stack">
    <div class="controls">${assetSelect("s-t", st.t)}${periodSelect("s-p", st.period)}<div class="field"><label for="s-m">Aportación mensual</label><input id="s-m" type="number" min="10" step="10" value="${st.monthly}" style="width:140px"></div></div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">Total aportado</div><div class="v">${money(d.invested)}</div><div class="d muted">${Math.round(d.invested / st.monthly)} meses</div></div>
      <div class="kpi"><div class="lbl">Aportando cada mes</div><div class="v">${money(d.final)}</div><div class="d ${cls(d.final - d.invested)}">${pct(d.final / d.invested - 1, true)}</div></div>
      <div class="kpi"><div class="lbl">Todo al inicio</div><div class="v">${money(lumpFinal)}</div><div class="d ${cls(lumpFinal - d.invested)}">${pct(lumpFinal / d.invested - 1, true)}</div></div>
      <div class="kpi"><div class="lbl">Diferencia</div><div class="v ${cls(d.final - lumpFinal)}">${money(d.final - lumpFinal)}</div><div class="d muted">a favor de ${d.final >= lumpFinal ? "aportar cada mes" : "invertir al inicio"}</div></div>
    </div>
    <div class="panel"><div id="s-chart"></div></div>
    <p class="muted">Las rentabilidades pasadas no garantizan las futuras. No incluye comisiones, impuestos ni tipo de cambio.</p>
  </div>`;
  lineChart(document.getElementById("s-chart"), s.dates, [{ name: "Aportando cada mes", data: d.valor, color: css("--s1") }, { name: "Todo al inicio", data: lump, color: css("--s2") }, { name: "Dinero aportado", data: d.aportado, color: css("--ink-3"), width: 1.5, dash: true }], { height: 360, label: "Simulación DCA" });
  bind("s-t", "change", v => st.t = v); bind("s-p", "change", v => st.period = v); bind("s-m", "change", v => st.monthly = Math.max(1, +v || 200));
}

function pageGuide() {
  app.innerHTML = `
  <div class="guide">
  <h1>Guía rápida</h1>
  <p class="lede">Qué hace cada sección, cómo se escriben los símbolos y qué significan los términos.</p>
  <div class="panel">
    <h2 style="margin-top:0">Secciones</h2>
    <dl>
      <dt>Mercado</dt><dd>Precio, variación y lectura técnica de decenas de activos. Ordena por cualquier columna.</dd>
      <dt>Analizar activo</dt><dd>Gráfico con medias móviles, RSI, MACD, métricas de riesgo y la lectura técnica explicada.</dd>
      <dt>Comparar</dt><dd>Rentabilidad, riesgo y correlación entre varios activos, para diversificar mejor.</dd>
      <dt>Mi cartera</dt><dd>Tus posiciones, ganancias, reparto por clase y cuánto comprar o vender para rebalancear.</dd>
      <dt>Simulador</dt><dd>Aportar cada mes frente a invertir de golpe, con datos del pasado.</dd>
    </dl>
    <h2>Símbolos</h2>
    <div class="tbl-wrap"><table><tbody>
      <tr><td>Acciones</td><td><code>AAPL</code> <code>KO</code> <code>SAN.MC</code> (Madrid) <code>GGAL.BA</code> (Buenos Aires)</td></tr>
      <tr><td>Materias primas</td><td><code>GC=F</code> oro · <code>SI=F</code> plata · <code>CL=F</code> petróleo · <code>ZW=F</code> trigo</td></tr>
      <tr><td>Criptomonedas</td><td><code>BTC-USD</code> <code>ETH-USD</code></td></tr>
      <tr><td>Índices</td><td><code>^GSPC</code> S&amp;P 500 · <code>^IBEX</code> · <code>^MERV</code></td></tr>
      <tr><td>Divisas</td><td><code>EURUSD=X</code> <code>USDMXN=X</code></td></tr>
    </tbody></table></div>
    <h2>Glosario</h2>
    <dl>
      <dt>CAGR</dt><dd>Rentabilidad media anual compuesta del periodo.</dd>
      <dt>Volatilidad</dt><dd>Cuánto oscila el precio. Más volatilidad significa más riesgo.</dd>
      <dt>Sharpe</dt><dd>Rentabilidad extra por cada unidad de riesgo. Por encima de 1 suele considerarse bueno.</dd>
      <dt>Máxima caída</dt><dd>La peor bajada desde un máximo. Indica cuánta pérdida habrías tenido que aguantar.</dd>
      <dt>Media móvil 50 / 200</dt><dd>Precio medio de las últimas 50 o 200 sesiones. Marca la tendencia.</dd>
      <dt>RSI</dt><dd>Va de 0 a 100. Por encima de 70, sobrecompra; por debajo de 30, sobreventa.</dd>
      <dt>MACD</dt><dd>Diferencia entre dos medias exponenciales. Mide el impulso del precio.</dd>
      <dt>DCA</dt><dd>Invertir una cantidad fija cada cierto tiempo, sin intentar adivinar el mejor momento.</dd>
    </dl>
    <h2>Principios básicos</h2>
    <ul class="reasons">
      <li>Diversifica entre clases de activo y regiones. Que ninguna posición pese demasiado.</li>
      <li>Invierte a largo plazo solo dinero que no vayas a necesitar pronto, y ten un fondo de emergencia.</li>
      <li>Para materias primas suelen usarse ETF (como <code>GLD</code> para el oro) en vez de futuros, que vencen y llevan apalancamiento.</li>
      <li>Vigila comisiones e impuestos: con los años reducen mucho la rentabilidad.</li>
    </ul>
    <p class="muted">Esta herramienta es educativa y no es asesoramiento financiero.</p>
  </div>
  </div>`;
}

// Redibuja al cambiar de tema para que los gráficos tomen los colores correctos.
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
let rsz, lastW = innerWidth; addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (innerWidth !== lastW) { lastW = innerWidth; render(); } }, 200); });
render();
initStorage();
</script>
