name: Android Game - Build APK

on:
  push:
    paths:
      - "android-game/**"
      - ".github/workflows/android-game-build.yml"
  pull_request:
    paths:
      - "android-game/**"
      - ".github/workflows/android-game-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-game
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aquelarre-rpg-debug-apk
          path: android-game/app/build/outputs/apk/debug/app-debug.apk
